name: Libspectrum for WII
run-name: Build and test Libspectrum for WII / ${{ github.actor }} /

on:
  # Called from fuse app, fuse utils repos
  workflow_call:
    inputs:
      # Name this setup (no spaces please)
      key:
        type: string
        required: true
      # Path where to clone
      path:
        type: string
        required: false
        default: '.'
      # Which branch to checkout
      branch:
        type: string
        required: false
        default: ""
      # Configure supported libs
      use_zlib:
        type: boolean
        required: false
        default: true
      use_bzip2:
        type: boolean
        required: false
        default: true
      use_libgcrypt:
        type: boolean
        required: false
        default: true
      use_fake_glib:
        type: boolean
        required: false
        default: false
      # Repo is taken from var.LIBSPECTRUM_REPO, cannot be passed as input.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: devkitpro/devkitppc
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path || '.' }}
    env:
      # Support push and call triggers, set env.variables
      LIBSPECTRUM_REPO: ${{ vars.LIBSPECTRUM_REPO || '' }}
      LIBSPECTRUM_BRANCH: ${{ inputs.branch || '' }}
      LIBSPECTRUM_PATH: ${{ inputs.path || '.' }}

    steps:
      - name: (1) Prepare environment
        run: |
          echo "Libspectrum repo: $LIBSPECTRUM_REPO"
          echo "Libspectrum branch: $LIBSPECTRUM_BRANCH"
          echo "Libspectrum path: $LIBSPECTRUM_PATH"
          
          echo "Use lib zlib: ${{ inputs.use_zlib && 'yes' || 'no' }}"
          echo "Use lib bzip2: ${{ inputs.use_bzip2 && 'yes' || 'no' }}"
          echo "Use lib libgcrypt: ${{ inputs.use_libgcrypt && 'yes' || 'no' }}"
          echo "Use fake glib: ${{ inputs.use_fake_glib && 'yes' || 'no' }}"
          
          echo "Available pacman packages:"
          dkp-pacman -Sl
          echo ""
          
          echo "Available devkitPro packages:"
          dkp-pacman -Sl dkp-libs
          echo ""

      - name: (2) Check out repository code
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LIBSPECTRUM_REPO }}
          ref: ${{ env.LIBSPECTRUM_BRANCH }}
          path: ${{ env.LIBSPECTRUM_PATH }}

      - name: (3) Restore lib packages
        run: |
          echo "Not needed here"

      - name: (4) Install dependencies
        run: |
          echo "Installing dependencies .."
          echo "Using devkitpro/devkitppc image"
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            wget tar python3 && \
          sudo rm -rf /var/lib/apt/lists/*
          echo "Done."

      - name: (5) Save lib packages
        run: |
          echo "Not needed here"

      - name: (6) Set up CMake
        run: |
          echo "Installing devkitPro CMake toolchain files and a recent CMake .."
          sudo dkp-pacman -S --noconfirm wii-cmake
          sudo apt-get -y install --no-install-recommends python3-pip
          sudo pip3 install --break-system-packages cmake
          cmake --version

      - name: (7) Configure for WII
        run: |
          echo "Running cmake .."
          cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Wii.cmake \
          -DCMAKE_INSTALL_PREFIX=$DEVKITPPC \
          -DZLIB_SUPPORT=${{ inputs.use_zlib && 'ON' || 'OFF' }} \
          -DBZIP2_SUPPORT=${{ inputs.use_bzip2 && 'ON' || 'OFF' }} \
          -DLIBGCRYPT_SUPPORT=${{ inputs.use_libgcrypt && 'ON' || 'OFF' }} \
          -DUSE_FAKE_GLIB=${{ inputs.use_fake_glib && 'ON' || 'OFF' }} \
          | tee ./cmake.out

      - name: (8) Verify output from cmake
        run: |
          .github/scripts/in_cmake.sh "libspectrum is ready to be compiled"
          .github/scripts/in_cmake.sh "zlib support: ${{ inputs.use_zlib && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "bzip2 support: ${{ inputs.use_bzip2 && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "libgcrypt support: ${{ inputs.use_libgcrypt && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "selected WAV backend: pcm"
          .github/scripts/in_cmake.sh "Internal GLib replacement: ${{ inputs.use_fake_glib && 'yes' || 'no' }}"

      - name: (9) Build
        run: |
          echo "Running cmake --build .."
          cmake --build build

      - name: (10) Install
        run: |
          echo "Running cmake --install .."
          sudo cmake --install build

      - name: (11) Copy dependencies
        run: |
          echo "Not needed here."

      - name: (12) Run tests
        id: run-tests
        run: |
          echo "Building and running tests .."
          ## ctest  <-- cross compiled, cannot execute under Linux
          echo "FIXME: ctest not possible, cross compiled."

      - name: (13) Verbose check tests (on failure)
        if: failure() && steps.run-tests.outcome != 'success'
        run: |
          echo "Listing all tests individually .."
          ## test/test  <-- cross compiled, cannot execute under Linux
          echo "FIXME: test/test not possible, cross compiled."

      - name: (14) Pack installed library files
        # Need to pack files to maintain permissions (+x mainly)
        run: |
          find /opt/devkitpro/devkitPPC | grep libspectrum > .tar_files
          sudo tar -cvf \
          libspectrum-installed-wii.tar \
          -C /opt/devkitpro/devkitPPC/ -T.tar_files

      - name: (15) Upload generated tar file
        uses: actions/upload-artifact@v7
        with: 
          name: libspectrum-installed-wii-${{ inputs.key }}
          path: |
            libspectrum-installed-wii.tar

      - name: (16) Finish
        run: |
          echo "🍏 Finishing with status ${{ job.status }}."
