name: Libspectrum for Windows
run-name: Build and test Libspectrum for Windows / ${{ github.actor }} /

on:
  # Called from fuse app, fuse utils repos
  workflow_call:
    inputs:
      # Name this setup (no spaces please)
      key:
        type: string
        required: true
      # Path where to clone
      path:
        type: string
        required: false
        default: '.'
      # Which branch to checkout
      branch:
        type: string
        required: false
        default: ""
      # Configure supported libs
      use_zlib:
        type: boolean
        required: false
        default: true
      use_bzip2:
        type: boolean
        required: false
        default: true
      use_libgcrypt:
        type: boolean
        required: false
        default: true
      # Repo is taken from var.LIBSPECTRUM_REPO, cannot be passed as input.

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash.exe --login --norc -eo pipefail -o igncr '{0}'
        working-directory: ${{ inputs.path || '.' }}
    env:
      CYGWIN_NOWINPATH: 1
      
      # Custom build libraries
      CPPFLAGS: "-I/usr/local/i686-w64-mingw32/include"
      LDFLAGS: "-L/usr/local/i686-w64-mingw32/lib"
      PKG_CONFIG_LIBDIR: "/usr/local/i686-w64-mingw32/lib/pkgconfig:/usr/i686-w64-mingw32/sys-root/mingw/lib/pkgconfig"
      # Small help when copying dlls
      CYGWIN_LIBDIR: "/usr/i686-w64-mingw32/sys-root/mingw/bin/"
      
      # Support push and call triggers, set env.variables
      LIBSPECTRUM_REPO: ${{ vars.LIBSPECTRUM_REPO || '' }}
      LIBSPECTRUM_BRANCH: ${{ inputs.branch || '' }}
      LIBSPECTRUM_PATH: ${{ inputs.path || '.' }}

    steps:
      - name: (1) Prepare environment
        run: |
          cd ${GITHUB_WORKSPACE}
          
          echo "Adjust autocrlf in git.."
          git config --global core.autocrlf input
          
          echo "Libspectrum repo: $LIBSPECTRUM_REPO"
          echo "Libspectrum branch: $LIBSPECTRUM_BRANCH"
          echo "Libspectrum path: $LIBSPECTRUM_PATH"
          
          echo "Use lib zlib: ${{ inputs.use_zlib && 'yes' || 'no' }}"
          echo "Use lib bzip2: ${{ inputs.use_bzip2 && 'yes' || 'no' }}"
          echo "Use lib libgcrypt: ${{ inputs.use_libgcrypt && 'yes' || 'no' }}"

      - name: (2) Check out repository code
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LIBSPECTRUM_REPO }}
          ref: ${{ env.LIBSPECTRUM_BRANCH }}
          path: ${{ env.LIBSPECTRUM_PATH }}

      - name: (2b) Resolve Cygwin package cache path
        id: cygwin-cache-path
        shell: pwsh
        run: |
          # Match cygwin-install-action's default drive selection.
          $volume = if (Test-Path -LiteralPath 'D:\') { 'D:' } else { 'C:' }
          "path=$volume\cygwin-packages" >> $env:GITHUB_OUTPUT

      - name: (3) Restore Cygwin packages
        id: cygwin-cache-load
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.cygwin-cache-path.outputs.path }}
          key: cygwin-packages-libspectrum-${{ hashFiles('.github/workflows/build_windows_sub.yml') }}
          restore-keys: |
            cygwin-packages-libspectrum-

      - name: (4) Install Cygwin (32 bit) with libs
        id: cygwin-install
        uses: cygwin/cygwin-install-action@711d29f3da23c9f4a1798e369a6f01198c13b11a # v6
        with:
          platform: x86
          packages: |
            bison \
            flex \
            gcc-core \
            gcc-g++ \
            cmake \
            gettext-devel \
            make \
            mingw64-i686-bzip2 \
            mingw64-i686-gcc-core \
            mingw64-i686-gcc-g++ \
            mingw64-i686-libgcrypt \
            mingw64-i686-libgpg-error \
            mingw64-i686-libpng \
            mingw64-i686-win-iconv \
            mingw64-i686-winpthread \
            mingw64-i686-zlib \
            pkg-config \
            python3
        # All libs are always installed to have just one cache key
            
      - name: (5) Save Cygwin packages
        id: cygwin-cache-save
        if: steps.cygwin-cache-load.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.cygwin-install.outputs.package-cache }}
          key: cygwin-packages-libspectrum-${{ hashFiles('.github/workflows/build_windows_sub.yml') }}

      - name: (6) Prepare CMake
        run: |
          cd ${GITHUB_WORKSPACE}
          
          cmake --version

      - name: (7) Configure for Windows (fake glib)
        run: |
          cd ${GITHUB_WORKSPACE}
          
          echo "Running cmake .."
          cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
          -DCMAKE_FIND_ROOT_PATH=/usr/i686-w64-mingw32/sys-root/mingw \
          -DCMAKE_INSTALL_PREFIX=/usr/local/i686-w64-mingw32 \
          -DLIBSPECTRUM_BUILD_TESTS=ON \
          -DUSE_FAKE_GLIB=ON \
          -DZLIB_SUPPORT=${{ inputs.use_zlib && 'ON' || 'OFF' }} \
          -DBZIP2_SUPPORT=${{ inputs.use_bzip2 && 'ON' || 'OFF' }} \
          -DLIBGCRYPT_SUPPORT=${{ inputs.use_libgcrypt && 'ON' || 'OFF' }} \
          | tee ./cmake.out

      - name: (8) Verify output from cmake
        run: |
          cd ${GITHUB_WORKSPACE}
          
          .github/scripts/in_cmake.sh "libspectrum is ready to be compiled"
          .github/scripts/in_cmake.sh "zlib support: ${{ inputs.use_zlib && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "bzip2 support: ${{ inputs.use_bzip2 && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "libgcrypt support: ${{ inputs.use_libgcrypt && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "selected WAV backend: pcm"
          .github/scripts/in_cmake.sh "Internal GLib replacement: yes"

      - name: (9) Build
        run: |
          cd ${GITHUB_WORKSPACE}
          
          echo "Running cmake --build .."
          cmake --build build

      - name: (10) Install
        run: |
          cd ${GITHUB_WORKSPACE}
          
          echo "Running cmake --install --strip .."
          cmake --install build --strip

      - name: (11) Copy dependency dlls
        run: |
          cd ${GITHUB_WORKSPACE}
          
          echo "Copying mandatory dependency dlls.."
          cp -f ${CYGWIN_LIBDIR}libgcc_s_sjlj-1.dll .
          cp -f ${CYGWIN_LIBDIR}libwinpthread-1.dll .
          cp -f ${CYGWIN_LIBDIR}libgpg-error-0.dll .
          cp -f ${CYGWIN_LIBDIR}libstdc++-6.dll .
          
          echo "Copying optional dependency dlls.."
          ${{ inputs.use_zlib         && 'cp -f ${CYGWIN_LIBDIR}zlib1.dll .'          || ''}}
          ${{ inputs.use_bzip2        && 'cp -f ${CYGWIN_LIBDIR}libbz2-1.dll .'       || ''}}
          ${{ inputs.use_libgcrypt    && 'cp -f ${CYGWIN_LIBDIR}libgcrypt-20.dll .'   || ''}}
          
          echo "Copying own dll.."
          cp -f build/libspectrum*.dll .
          
      - name: (12) Run tests
        id: run-tests
        run: |
          cd ${GITHUB_WORKSPACE}
          
          echo "Building and running tests .."
          cd build
          ctest --output-on-failure

      - name: (13) Verbose check tests (on failure)
        if: failure() && steps.run-tests.outcome != 'success'
        run: |
          cd ${GITHUB_WORKSPACE}
          
          echo "Listing all tests individually .."
          build/test/test.exe

      - name: (14) Pack installed library files
        # Need to pack files to maintain permissions
        run: |
          cd ${GITHUB_WORKSPACE}
          
          tar -cvf \
          libspectrum-installed-windows.tar \
          -C /usr/local/i686-w64-mingw32/ .

      - name: (14) Upload generated tar file
        uses: actions/upload-artifact@v7
        with: 
          name: libspectrum-installed-windows-${{ inputs.key }}
          path: |
            libspectrum-installed-windows.tar

      - name: (15) Finish
        run: |
          echo "🍏 Finishing with status ${{ job.status }}."
