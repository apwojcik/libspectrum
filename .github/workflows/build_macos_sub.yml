name: Libspectrum for MacOS
run-name: Build and test Libspectrum for MacOS / ${{ github.actor }} /

on:
  # Called from fuse app, fuse utils repos
  workflow_call:
    inputs:
      # Name this setup (no spaces please)
      key:
        type: string
        required: true
      # Path where to clone
      path:
        type: string
        required: false
        default: '.'
      # Which branch to checkout
      branch:
        type: string
        required: false
        default: ""
      # Configure supported libs
      use_zlib:
        type: boolean
        required: false
        default: true
      use_bzip2:
        type: boolean
        required: false
        default: true
      use_libgcrypt:
        type: boolean
        required: false
        default: true
      use_fake_glib:
        type: boolean
        required: false
        default: false
      # Repo is taken from var.LIBSPECTRUM_REPO, cannot be passed as input.

jobs:
  build:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.path || '.' }}
    env:
      # Support push and call triggers, set env.variables
      LIBSPECTRUM_REPO: ${{ vars.LIBSPECTRUM_REPO || '' }}
      LIBSPECTRUM_BRANCH: ${{ inputs.branch || '' }}
      LIBSPECTRUM_PATH: ${{ inputs.path || '.' }}

    steps:
      - name: (1) Prepare environment
        run: |
          echo -n "Current directory: "
          pwd
          ls -la
          
          echo "Libspectrum repo: $LIBSPECTRUM_REPO"
          echo "Libspectrum branch: $LIBSPECTRUM_BRANCH"
          echo "Libspectrum path: $LIBSPECTRUM_PATH"
          
          echo "Use lib zlib: ${{ inputs.use_zlib && 'yes' || 'no' }}"
          echo "Use lib bzip2: ${{ inputs.use_bzip2 && 'yes' || 'no' }}"
          echo "Use lib libgcrypt: ${{ inputs.use_libgcrypt && 'yes' || 'no' }}"
          echo "WAV backend: pcm"
          echo "Use fake glib: ${{ inputs.use_fake_glib && 'yes' || 'no' }}"

      - name: (2) Check out repository code
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LIBSPECTRUM_REPO }}
          ref: ${{ env.LIBSPECTRUM_BRANCH }}
          path: ${{ env.LIBSPECTRUM_PATH }}

      - name: (3) Restore Homebrew download cache
        id: brew-cache-load
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-libspectrum-${{ hashFiles('.github/workflows/build_macos_sub.yml') }}
          restore-keys: |
            brew-downloads-libspectrum-

      - name: (4) Install dependencies
        run: |
          echo "Inspect if brew installed .."
          brew doctor || true
          
          echo "Installing dependencies .."
          brew install \
            bzip2 \
            libgcrypt \
            glib

          echo "Configuring Homebrew search paths .."
          echo "CPPFLAGS=-I$(brew --prefix)/include -I$(brew --prefix bzip2)/include -I$(brew --prefix libgcrypt)/include -I$(brew --prefix glib)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib -L$(brew --prefix bzip2)/lib -L$(brew --prefix libgcrypt)/lib -L$(brew --prefix glib)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix bzip2)/lib/pkgconfig:$(brew --prefix libgcrypt)/lib/pkgconfig:$(brew --prefix glib)/lib/pkgconfig" >> "$GITHUB_ENV"


      - name: (5) Save Homebrew download cache
        id: brew-cache-save
        if: steps.brew-cache-load.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-libspectrum-${{ hashFiles('.github/workflows/build_macos_sub.yml') }}

      - name: (6) Set up CMake
        uses: lukka/get-cmake@latest

      - name: (7) Configure for MacOS
        run: |
          echo "Running cmake .."
          cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIBSPECTRUM_BUILD_TESTS=ON \
          -DZLIB_SUPPORT=${{ inputs.use_zlib && 'ON' || 'OFF' }} \
          -DBZIP2_SUPPORT=${{ inputs.use_bzip2 && 'ON' || 'OFF' }} \
          -DLIBGCRYPT_SUPPORT=${{ inputs.use_libgcrypt && 'ON' || 'OFF' }} \
          -DUSE_FAKE_GLIB=${{ inputs.use_fake_glib && 'ON' || 'OFF' }} \
          | tee ./cmake.out

      - name: (8) Verify output from cmake
        run: |
          .github/scripts/in_cmake.sh "libspectrum is ready to be compiled"
          .github/scripts/in_cmake.sh "zlib support: ${{ inputs.use_zlib && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "bzip2 support: ${{ inputs.use_bzip2 && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "libgcrypt support: ${{ inputs.use_libgcrypt && 'yes' || 'no' }}"
          .github/scripts/in_cmake.sh "selected WAV backend: pcm"
          .github/scripts/in_cmake.sh "Internal GLib replacement: ${{ inputs.use_fake_glib && 'yes' || 'no' }}"

      - name: (9) Build
        run: |
          echo "Running cmake --build .."
          cmake --build build

      - name: (10) Install
        run: |
          echo "Running cmake --install .."
          sudo cmake --install build

      - name: (11) Copy dependencies
        run: |
          echo "Not needed here."

      - name: (12) Run tests
        id: run-tests
        run: |
          echo "Building and running tests .."
          cd build
          ctest --output-on-failure

      - name: (13) Verbose check tests (on failure)
        if: failure() && steps.run-tests.outcome != 'success'
        run: |
          cd ${GITHUB_WORKSPACE}/build
          
          echo "Listing all tests individually .."
          test/test

      - name: (14) Pack installed library files
        # Need to pack files to maintain permissions (+x mainly)
        run: |
          find /usr/local | grep libspectrum > .tar_files
          sudo tar -cvf \
          libspectrum-installed-macos.tar \
          -C /usr/local/ -T.tar_files

      - name: (15) Upload generated tar file
        uses: actions/upload-artifact@v7
        with: 
          name: libspectrum-installed-macos-${{ inputs.key }}
          path: |
            libspectrum-installed-macos.tar

      - name: (16) Finish
        run: |
          echo "🍏 Finishing with status ${{ job.status }}."
